[package]
name = "lumagame-gamestream"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Sunshine and Apollo streaming engine for LumaGame on LG webOS"
repository = "https://github.com/nphil/lumagame-gamestream"
build = "build.rs"

[dependencies]
lumagame-core = { git = "https://github.com/nphil/lumatv", rev = "0de47bc1f1b3b290d3ff8b88ce58366201d85204" }
lumatv-gfn-pad = { git = "https://github.com/nphil/lumatv", rev = "0de47bc1f1b3b290d3ff8b88ce58366201d85204" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openssl = "0.10"
openssl-sys = { version = "0.9", features = ["vendored"] }
roxmltree = "0.21"
mdns-sd = "0.21"
libc = "0.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"
